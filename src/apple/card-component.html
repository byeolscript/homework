<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Apple Card Component</title>
    <link rel="icon" href="./favicon/apple-favicon.svg" />
    <link rel="apple-touch-icon" href="./favicon/apple-favicon.svg" />
    <link href="https://cdn.jsdelivr.net/gh/sun-typeface/SUIT/fonts/variable/woff2/SUIT-Variable.css" rel="stylesheet" />
    <link rel="stylesheet" href="./styles/card-component.css" />
  </head>
  <body>
    <!-- 카드 컴포넌트 -->

    <div class="card-black-component">
      <p class="card-black-title">제목</p>
      <p class="card-black-description">소개내용</p>
      <p class="card-release-date">출시내용</p>
      <div class="card-buttons">
        <button class="card-button-blue">버튼</button>
        <button class="card-button-blueblack">버튼</button>
      </div>
    </div>

    <div class="card-white-component">
      <p class="card-white-title">제목</p>
      <p class="card-white-description">소개내용</p>
      <p class="card-release-date">출시내용</p>
      <div class="card-buttons">
        <button class="card-button-black">버튼</button>
        <button class="card-button-blackwhite">버튼</button>
      </div>
    </div>
  </body>
</html>
