<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Apple Card Layout</title>
    <link rel="icon" href="./favicon/apple-favicon.svg" />
    <link rel="apple-touch-icon" href="./favicon/apple-favicon.svg" />
    <link href="https://cdn.jsdelivr.net/gh/sun-typeface/SUIT/fonts/variable/woff2/SUIT-Variable.css" rel="stylesheet" />
    <link rel="stylesheet" href="./styles/apple.css" />
  </head>
  <body>
    <!-- 카드 레이아웃 -->
    <div class="applecard">
      <div class="card-black-component" id="ipadpro">
        <p class="card-black-title">iPad Pro</p>
        <p class="card-black-description">놀라우리만치 얇다. <br />엄청나게 강력하다.</p>
        <p class="card-release-date">출시일 추후 공개</p>
        <div class="card-buttons">
          <button type="button" class="card-button-blue">더 알아보기</button>
          <button type="button" class="card-button-blueblack">가격보기</button>
        </div>
      </div>

      <div class="card-white-component" id="ipadair">
        <p class="card-white-title">iPad air</p>
        <p class="card-white-description">두 가지 사이즈. 더 빠른 칩. <br />무엇이든 거뜬하게.</p>
        <p class="card-release-date">출시일 추후 공개</p>
        <div class="card-buttons">
          <button type="button" class="card-button-black">더 알아보기</button>
          <button type="button" class="card-button-blackwhite">가격보기</button>
        </div>
      </div>

      <div class="card-black-component" id="iphone15pro">
        <p class="card-black-title">iPhone 15 Pro</p>
        <p class="card-black-description">티타늄. 초강력. 초경량. 초프로.</p>
        <div class="card-buttons">
          <button type="button" class="card-button-blue">더 알아보기</button>
          <button type="button" class="card-button-blueblack">가격보기</button>
        </div>
      </div>

      <div class="card-white-component" id="iphone15">
        <p class="card-white-title">iPhone 15</p>
        <p class="card-white-description">새로운 카메라. <br />새로운 디자인. <br />새로움이 물씬.</p>
        <div class="card-buttons">
          <button type="button" class="card-button-black">더 알아보기</button>
          <button type="button" class="card-button-blackwhite">가격보기</button>
        </div>
      </div>

      <div class="card-black-component" id="watch">
        <p class="card-black-title">WATCH</p>
        <p class="card-black-description">보다 똑똑. 보다 또렷. 보다 강력.</p>
        <div class="card-buttons">
          <button type="button" class="card-button-blue">더 알아보기</button>
          <button type="button" class="card-button-blueblack">가격보기</button>
        </div>
      </div>

      <div class="card-white-component" id="macbookair">
        <p class="card-white-title">MacBook air</p>
        <p class="card-white-description">날렵하게. 강력하게. M3답게.</p>
        <div class="card-buttons">
          <button type="button" class="card-button-black">더 알아보기</button>
          <button type="button" class="card-button-blackwhite">가격보기</button>
        </div>
      </div>

      <div class="card-black-component" id="airpodspro">
        <p class="card-black-title">airPods Pro</p>
        <p class="card-black-description">전에 없던 청취 경험. <br />적응형 오디오.</p>
        <div class="card-buttons">
          <button type="button" class="card-button-blue">더 알아보기</button>
          <button type="button" class="card-button-blueblack">가격보기</button>
        </div>
      </div>
    </div>
  </body>
</html>
